name: auto-semver
description: >
  Works out the next semver release from the conventional commits since the
  last vX.Y.Z tag, and outputs version, tag and bump.
author: ynochange

inputs:
  token:
    description: Token for the GitHub API, to read tags and commits.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The next version, e.g. 1.2.3; empty when there's nothing to release. When HEAD is already tagged, that version.
  tag:
    description: The tag to push, e.g. v1.2.3; empty when there's nothing to tag.
  bump:
    description: major, minor or patch; empty when there's nothing to release.

runs:
  using: node24
  main: index.js
